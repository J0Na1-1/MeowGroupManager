[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-group-guard"
version = "0.1.0"
description = "Production-oriented Telegram join verification and cleanup bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "asyncssh>=2.17,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "cryptography>=43,<45",
  "pydantic-settings>=2.5,<3",
  "aiosqlite>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]
